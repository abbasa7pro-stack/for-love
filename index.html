<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Zainy 💖</title>

<style>
* {
  box-sizing: border-box;
  font-family: 'Poppins', sans-serif;
}

body {
  margin: 0;
  height: 100vh;
  background: linear-gradient(135deg, #ff9a9e, #fad0c4);
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
}

.screen {
  display: none;
  text-align: center;
  padding: 20px;
  width: 100%;
  max-width: 420px;
}

.active {
  display: block;
}

h1, p {
  color: #fff;
  line-height: 1.6;
}

button {
  padding: 12px 24px;
  font-size: 16px;
  border: none;
  border-radius: 30px;
  cursor: pointer;
  margin: 10px;
}

#yesBtn {
  background: #ff4d6d;
  color: white;
}

#noBtn {
  background: white;
  color: #ff4d6d;
  transition: all 0.3s ease;
}

.tap {
  margin-top: 18px;
  font-size: 14px;
  opacity: 0.85;
}

.heart {
  position: fixed;
  bottom: -20px;
  font-size: 22px;
  animation: floatUp 5s linear infinite;
}

@keyframes floatUp {
  0% { transform: translateY(0); opacity: 1; }
  100% { transform: translateY(-100vh); opacity: 0; }
}

.slideshow img {
  width: 100%;
  border-radius: 18px;
  display: none;
}
</style>
</head>

<body>

<!-- SCREEN 1 -->
<div class="screen active" id="screen1">
  <h1>Will you be my Valentine, Zainy? 💖</h1>
  <button id="yesBtn">Yes 💕</button>
  <button id="noBtn">No 🙈</button>
</div>
